 표시 가능."]},{title:"셀 교환·입력 (교사별 보기)",items:["칸에 마우스를 올리면 사용법 말풍선이 나타납니다.","빈 칸을 클릭하면 바로 입력 모달이 열려 학년·반·과목·특별실을 채울 수 있습니다.","채워진 칸을 클릭하면 파란 테두리로 선택됩니다.","선택 후 다른 칸을 클릭하면 두 칸의 내용이 서로 바뀝니다 (빈 칸이면 이동).","선택한 칸을 다시 클릭하면 선택 해제 후 편집 모달이 열립니다."]},{title:"수동 수정",items:["교사별 보기에서 같은 셀을 다시 클릭하거나, 학급별 보기에서 셀을 클릭하면 편집 모달이 열립니다.","미배정(빨간 셀)을 클릭해 수동으로 채울 수 있습니다.","수동 편집은 즉시 학급별·특별실 시간표에 동기화됩니다."]},{title:"빨간색 표시 조건",items:["교사 시간 중복: 같은 교사가 같은 시간에 다른 학급 수업 중일 때.","점심시간 슬롯: 해당 학년의 점심시간에 수업이 배정된 경우.","교시 편제 초과: 해당 학년의 해당 요일 수업 시수를 넘긴 슬롯에 배정된 경우."]},{title:"미배정 시수 표",items:["제약 조건상 자동 배정에 실패한 수업이 있으면 페이지 상단에 빨간 표로 표시됩니다.","표는 수동 편집과 실시간 동기화되어 수동으로 채우면 자동으로 사라집니다.","미배정이 많으면 교사 시수, 과목별 연속 수업 설정, 특별실 사용 제약을 조정해보세요."]},{title:"엑셀 내보내기",items:["교사별 엑셀: 교사 단위로 시간표를 내보냅니다.","학급별 엑셀: 학급 단위로 시간표를 내보냅니다."]},{title:"작년 시간표 직접 입력 (역입력)",items:["자동 생성을 누르지 않아도, 교사·과목을 등록하면 빈 시간표가 바로 나타나 직접 입력할 수 있습니다.","교사별 보기에서 빈 칸을 클릭하면 학년·반·과목·특별실을 골라 수업을 채울 수 있습니다.","작년 시간표를 이렇게 그대로 만들어 둔 뒤, 올해 바뀐 부분만 수정하면 다음 해에도 빠르게 활용할 수 있습니다.","먼저 학교 설정 → 전담 과목 → 전담 배정에 작년 기준 정보를 입력해 두면 칸 입력이 매끄럽습니다."]},{title:"점심시간 분리 배정",items:["점심시간 분리 배정 시 특별실 시간표, 전담교사 시간표는 7교시 형식으로 제시됩니다."]}];function B8(){var Me;const{state:e,setTimetableSlots:t}=as(),{gradeConfigs:r,subjects:n,teachers:a,lunchConfig:l,timetableSlots:o,rooms:c,roomBlockedSlots:u,externalInstructors:d}=e,[x,m]=le.useState(!1),[y,v]=le.useState(null),[k,w]=le.useState("teacher"),[_,E]=le.useState(!1),[N,T]=le.useState({subjectSettings:{}}),[F,H]=le.useState([{grade:1,classNum:1}]),[U,C]=le.useState(null);function O(j,Fe){H(xe=>{const Ae=xe.findIndex(Ne=>Ne.grade===j&&Ne.classNum===Fe);return Ae>=0?xe.filter((Ne,Ee)=>Ee!==Ae):[...xe,{grade:j,classNum:Fe}].sort((Ne,Ee)=>Ne.grade-Ee.grade||Ne.classNum-Ee.classNum)})}function L(j){const Fe=r.find(xe=>xe.grade===j);Fe&&H(xe=>{const Ae=xe.filter(Ee=>Ee.grade!==j),Ne=Array.from({length:Fe.num_classes},(Ee,me)=>({grade:j,classNum:me+1}));return[...Ae,...Ne].sort((Ee,me)=>Ee.grade-me.grade||Ee.classNum-me.classNum)})}function
